[project]
name = "ultra-low-latency-voice-agent"
version = "0.1.0"
description = "Ultra-Low-Latency Local LLM Voice Assistant with Pipecat, Sarvam AI, and SmallWebRTC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[sarvam,openai,silero,webrtc]>=1.7.0",
    "gradio>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
